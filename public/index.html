async function imgT(el,i){const f=el.files[0];if(!f)return;V.set.promos=V.set.promos||[{},{},{}];V.set.promos[i]=V.set.promos[i]||{};V.set.promos[i].img=await shrink(f,900);ss();draw()}
const pp=(id,b)=>api("/admin/products/"+id,{method:"PATCH",body:b}).then(p=>Object.assign(V.prods.find(x=>x.id==id),p)).catch(()=>{});
async function imgP(el,id){const f=el.files[0];if(!f)return;await pp(id,{img:await shrink(f,800)});draw()}

function rmT(i){if(V.set.promos&&V.set.promos[i]){V.set.promos[i].img="";ss();draw()}}
function pm(i,k,v){V.set.promos=V.set.promos||[{},{},{}];V.set.promos[i]=V.set.promos[i]||{};V.set.promos[i][k]=v;ss();draw()}

try{const p=await api("/admin/products",{method:"POST",body:{name:n,price:pr,was:+$("pw").value||0,cat:$("pc").value.trim(),stock:+$("ps").value||0,vars:$("pv").value.split(",").map(x=>x.trim()).filter(Boolean),img}});V.prods.unshift(p);draw();toast("Product saved")}catch(e){}}

<div class="pn"><h3>Orders &amp; analytics</h3><p>Page views: ${V.views} · Orders: ${V.orders.length} · Revenue: ${peso(V.orders.filter(o=>o.status!="Cancelled").reduce((a,o)=>a+o.total,0))} <button class="g" onclick="bk()" style="margin-left:10px">Download backup</button></p>${V.orders.map(o=>`<div class="ln"><span><b>#${o.id}</b> ${esc(o.name)} · ${esc(o.phone)}<br><small>${o.method=="pickup"?"Pickup · "+esc(o.pickup):"Deliver · "+esc([o.addr.street,o.addr.brgy,o.addr.city,o.addr.region].join(", "))}<br>${o.items.map(i=>esc(i.name)+(i.v?" ("+esc(i.v)+")":"")+" × "+i.n).join(", ")}${o.note?"<br>Note: "+esc(o.note):""}</small></span><span>${peso(o.total)} · ${esc(o.pay)} <select onchange="setSt(${o.id},this.value)">${["Awaiting payment",...STEPS[o.method],"Cancelled"].map(x=>`<option ${x==o.status?"selected":""}>${x}</option>`).join("")}</select></span></div>`).join("")}</div>`}

const POL={terms:"<p><i>Last updated: October 17, 2026</i></p>\n\n<h2>1. Who we are</h2>\n<p>This website is run by CYF Likha group (\"we\", \"us\"). You can contact us at omcyffinance@gmail.com. Our address is Pakyas, Victoria, Oriental Mindoro, Philippines.</p>\n\n<h2>2. Using the site</h2>\n<p>You must be able to form a binding contract to place orders. If you are under 18, use the site only with a parent or guardian. You agree to give accurate information and to keep your password private. Tell us if you think someone else has used your account.</p>\n\n<h2>3. Orders and payment</h2>\n<p>Prices are shown in Philippine pesos and include any discounts that apply when you check out. Orders are paid in cash when they are handed to you, unless we tell you that another payment method is available. An order is confirmed when it is placed. We may refuse or cancel an order if an item is out of stock, a price was shown in error, or we suspect misuse. If that happens, we will tell you and refund any payment already made.</p>\n\n<h2>4. Delivery</h2>\n<p>We deliver within the areas and time windows shown in the shop. Delivery times are estimates. If we cannot deliver, we will tell you the reason and cancel the order. Please give correct delivery details and be available to receive the order.</p>\n\n<h2>5. Cancellations and changes</h2>\n<p>You can cancel an order yourself only while it is still pending or awaiting payment confirmation. Once it has been packed, please contact the shop team. Cancelled orders return their stock to the shop. Some orders can be changed for a short time after they are placed, as shown on the order.</p>\n\n<h2>6. Returns and problems</h2>\n<p>If an item is missing, damaged, or wrong, contact the shop team through the chat within 24 hours of delivery. We will replace it or refund it when we can confirm the problem. Food that has been opened or consumed cannot be returned for hygiene reasons, except where the law requires otherwise.</p>\n\n<h2>7. Loyalty points, promo codes and offers</h2>\n<p>Loyalty points are earned on delivered orders, as shown on your dashboard. Points have no cash value and cannot be transferred. We may change the earning rate, redemption rules or expiry, and we may end the programme with reasonable notice. Promo codes and offers are limited to the terms shown with them and cannot be combined unless stated.</p>\n\n<h2>8. Custom requests</h2>\n<p>A custom request is a request, not an order. We will reply with a quote, and nothing is charged until you accept it.</p>\n\n<h2>9. AI assistant and messages</h2>\n<p>The CYF Likha group AI assistant can answer questions, show information and propose actions. It can make mistakes, so check anything important before you confirm it. Actions it proposes only happen after you press Confirm. Messages you send to the shop team may be read by our staff. Please read our Privacy Policy to learn how this information is handled.</p>\n\n<h2>10. Acceptable use</h2>\n<p>Do not place fake orders, abuse promo codes, harass staff or other customers, try to access accounts or data that are not yours, interfere with the site, or use the site for anything illegal. We may block accounts that break these rules.</p>\n\n<h2>11. Intellectual property</h2>\n<p>The site, its design and its content belong to us or our licensors. You may use it for your own shopping, but not copy or resell it.</p>\n\n<h2>12. Liability</h2>\n<p>To the extent the law allows, we are not liable for indirect or consequential losses, or for interruptions to the site. Nothing in these terms limits any right you have under the consumer protection laws of the Philippines.</p>\n\n<h2>13. Changes</h2>\n<p>We may update these terms. The date at the top shows the latest version. Continuing to use the site after a change means you accept the new terms.</p>\n\n<h2>14. Governing law</h2>\n<p>These terms are governed by the laws of the Republic of the Philippines. Disputes will be handled by the courts of Victoria, Oriental Mindoro, Philippines.</p>",privacy:"<p><i>Last updated: October 17, 2026</i></p>\n\n<h2>1. Who is responsible</h2>\n<p>CYF Likha group is the personal information controller for this site. Our data protection contact is CYF Likha group, omcyffinance@gmail.com.</p>\n\n<h2>2. What we collect</h2>\n<table>\n  <tr><th>What</th><th>Why</th></tr>\n  <tr><td>Account details: username, a password stored only in scrambled form, and your role (customer, seller or admin)</td><td>To let you sign in and place orders</td></tr>\n  <tr><td>Orders: items, quantities, prices, totals, status, cash on delivery, and any delivery notes you write</td><td>To prepare, deliver and record your order, and for our accounts</td></tr>\n  <tr><td>Messages to the shop team, and messages with other customers or sellers</td><td>To answer your questions and handle problems</td></tr>\n  <tr><td>Custom requests and your favorites</td><td>To handle the request and show your saved items</td></tr>\n  <tr><td>Loyalty points: earned points and history</td><td>To run the loyalty programme</td></tr>\n  <tr><td>Order alerts: the push subscription your browser or phone gives us</td><td>To send order updates, only if you turn them on</td></tr>\n  <tr><td>Security records: sign-in attempts, blocked requests and IP addresses</td><td>To keep accounts and the site safe</td></tr>\n  <tr><td>Device settings stored on your phone or computer: your sign-in session, cart, favorites and display options</td><td>So the site works the way you left it</td></tr>\n</table>\n\n<h2>3. AI assistant</h2>\n<p>When you use the CYF Likha group AI assistant, the words you type, and the part of the screen you are looking at (for example the page name, your cart, and an open product), are sent to the AI provider that powers it, which may be Google, Groq, OpenRouter, NVIDIA or another provider we have chosen. Voice reading uses Google's text-to-speech. Do not type passwords, card numbers or other secrets into the assistant. Assistant conversations are not used to train AI models by us, but the providers have their own policies, which you can read on their websites.</p>\n\n<h2>4. Why we use it and the legal basis</h2>\n<p>We use your information to take and deliver orders, keep your account secure, answer your messages, run loyalty and alerts you asked for, and meet our legal duties (for example tax and consumer records). Where we ask for consent, such as for order alerts, you can withdraw it at any time.</p>\n\n<h2>5. Who we share it with</h2>\n<p>We share only what is needed with: delivery staff (name, items, delivery notes and payment due), our hosting and database provider Render (hosting and database), the AI and voice providers described above, and the push service run by your browser or phone maker. We do not sell your personal information.</p>\n\n<h2>6. How long we keep it</h2>\n<p>Account and order records: 5 years, to meet tax and record rules. Chat messages: 1 year. Security records: 90 days. When you ask us to delete your account, we delete or anonymize what we no longer need to keep. Some records may be kept longer where the law requires it.</p>\n\n<h2>7. Cookies and similar technology</h2>\n<p>We do not use advertising cookies. The site uses your browser's local storage to keep your sign-in session, cart, favorites and display settings on your device. You can clear them at any time from your browser settings, which will sign you out.</p>\n\n<h2>8. Your rights</h2>\n<p>Under the Data Privacy Act you can ask to see your information, correct it, object to some uses, ask us to delete it or move it, withdraw consent, and complain to the National Privacy Commission. To use these rights, contact omcyffinance@gmail.com. We may ask you to confirm who you are first. You can also turn off order alerts and clear your loyalty history from your dashboard, or ask us to do so.</p>\n\n<h2>9. Keeping it safe</h2>\n<p>We use encryption in transit, scrambled passwords, role-based access for staff, audit logs, and limits on repeated sign-in attempts. No system is perfectly secure, so please keep your password private. If we learn of a breach that affects you, we will tell you and the National Privacy Commission as the law requires.</p>\n\n<h2>10. Children</h2>\n<p>The site is not intended for children under 13. If you believe a child has given us information, contact us and we will delete it.</p>\n\n<h2>11. Changes</h2>\n<p>We may update this policy. The date at the top shows the latest version. For major changes we will tell you on the site.</p>"};
